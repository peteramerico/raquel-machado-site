name: raquel-site

services:
  # Mesma identidade do container que já roda em produção (nome, projeto e volume externo):
  # o `docker compose up -d --build` só o recria para aplicar o healthcheck; os dados ficam no volume.
  mysql:
    image: mysql:8.0
    container_name: raquel-mysql
    restart: always
    # sem performance_schema: poupa ~100 MB de RAM numa VPS de 4 GB compartilhada
    command: ["--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - raquel-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  raquel-backend:
    build: .
    container_name: raquel-backend
    restart: unless-stopped
    env_file: .env
    # força os valores de rede do Docker; o .env da VPS (DB_HOST=127.0.0.1, PORT=3001) segue valendo sem edição
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      PORT: "3337"
    ports:
      - "127.0.0.1:3337:3337"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  raquel-mysql-data:
    external: true
    name: backend_raquel-mysql-data
