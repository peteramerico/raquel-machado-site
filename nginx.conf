# Referência da config do site na VPS: /etc/nginx/sites-available/raquelmachadoped
# NÃO é aplicada por deploy (nem pelo workflow nem pelo cron). Editar na VPS à mão:
#   cp /etc/nginx/sites-available/raquelmachadoped /root/backups/raquel-site/nginx.<data>.bak
#   (editar) && nginx -t && systemctl reload nginx
# e manter este arquivo igual ao da VPS.

server_tokens off;

server {
    listen 80;
    server_name raquelmachadoped.com.br www.raquelmachadoped.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name raquelmachadoped.com.br www.raquelmachadoped.com.br;

    ssl_certificate /etc/letsencrypt/live/raquelmachadoped.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raquelmachadoped.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.raquelmachadoped.com.br; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://analytics.raquelmachadoped.com.br; frame-src 'self' https://www.youtube.com https://www.instagram.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

    # www -> apex: o cookie de sessão (login) é host-only; sem isto a sessão se divide entre www e apex.
    if ($host = www.raquelmachadoped.com.br) {
        return 301 https://raquelmachadoped.com.br$request_uri;
    }

    # IP real do visitante (Cloudflare): /etc/nginx/conf.d/cloudflare-realip.conf (real_ip_header CF-Connecting-IP,
    # set_real_ip_from das faixas do Cloudflare). O rate limit do login (por IP) depende disso — não remover.

    # Blog descontinuado (2026-11): quem tinha o link vai para a home.
    location ~ ^/blog(/|$) {
        return 301 /;
    }

    # Apresentações estáticas (reveal.js), embutidas em /palestras/* por iframe da mesma origem.
    # add_header em location aninhado apaga os herdados do server: por isso repete todos aqui.
    # noindex: a página indexável é a da SPA (/palestras/...), não o arquivo estático.
    location = /apresentacoes/sala-de-parto { return 301 /apresentacoes/sala-de-parto/; }
    location ^~ /apresentacoes/ {
        root /var/www/raquel-frontend;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # API (container raquel-backend, 127.0.0.1:3337)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3337/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA React (inclui /familia, /links, /privacidade e, no futuro, /painel e /admin)
    location / {
        root /var/www/raquel-frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
